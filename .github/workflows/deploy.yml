# main への push で Cloudflare Workers へ自動デプロイする。
# 任意の GitHub Secret: EDINET_API_KEY（大量保有の日中取得用。Worker に未登録のときだけ secret put する）。
# 必要な GitHub Secret: CLOUDFLARE_API_TOKEN（Cloudflare ダッシュボード → アカウント API トークン →
# テンプレート「Cloudflare Workers を編集」＋「D1: 編集」を追加して作成）。
# Secret が未登録のあいだは deploy ジョブをスキップする（失敗扱いにしない）。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.probe.outputs.has_token }}
    steps:
      - id: probe
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "has_token=true" >> "$GITHUB_OUTPUT"; else echo "has_token=false" >> "$GITHUB_OUTPUT"; echo "::notice::CLOUDFLARE_API_TOKEN が未登録のためデプロイをスキップしました"; fi

  deploy:
    needs: check
    if: needs.check.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bc8a1301c0dee06331e987351cfe2339
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lint & test
        run: npm run lint && npm test
      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
      - name: Apply D1 migrations (idempotent)
        run: npx wrangler d1 migrations apply apollo-ipo-sync --remote
      - name: Deploy
        run: npx opennextjs-cloudflare deploy
      # 大量保有の日中取得（worker/intraday-holdings.ts）が使う EDINET の API キー。
      # Worker に未登録のときだけ GitHub Secret から入れる（値はログに出さない。差し替えたいときは Worker 側を消してから再デプロイ）。
      - name: Put EDINET_API_KEY (only when missing)
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ -z "$EDINET_API_KEY" ]; then echo "::notice::GitHub Secret EDINET_API_KEY が未登録のためスキップ"; exit 0; fi
          if npx wrangler secret list | grep -q '"EDINET_API_KEY"'; then echo "EDINET_API_KEY は登録済み"; exit 0; fi
          printf '%s' "$EDINET_API_KEY" | npx wrangler secret put EDINET_API_KEY
