# Cloudflare Workers の月間リクエスト数（アカウント全体）を毎時数え、しきい値（既定 9,000,000）を超えたら
# 本番 Worker kabu-radar をメンテ画面 Worker に差し替え、Issue を立て、ジョブを失敗させて通知する。
# CLOUDFLARE_API_TOKEN には「Account Analytics: Read」の権限が必要（deploy.yml と同じトークンに追加）。
# 復旧: 翌月 1 日（UTC）以降に「Deploy to Cloudflare Workers」を workflow_dispatch で実行する。
name: Usage Guard

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_maintenance:
        description: "テスト用: 利用量にかかわらずメンテ画面へ強制的に差し替える"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: bc8a1301c0dee06331e987351cfe2339
  GH_TOKEN: ${{ github.token }}

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 今月の利用量を確認
        id: check
        continue-on-error: true
        run: npm run guard:usage
      - name: メンテ画面へ差し替え
        id: maintenance
        if: steps.check.outputs.exceeded == 'true' || inputs.force_maintenance == true
        run: npx wrangler deploy --config scripts/guard/maintenance/wrangler.jsonc
      - name: Issue を作成
        if: steps.maintenance.outcome == 'success'
        env:
          TOTAL: ${{ steps.check.outputs.total }}
          LIMIT: ${{ steps.check.outputs.limit }}
        run: |
          gh label create usage-guard --color B60205 --description "利用量の番人" 2>/dev/null || true
          if [ -n "$(gh issue list --label usage-guard --state open --json number --jq '.[0].number')" ]; then
            echo "open の Issue があるため作成しない"
            exit 0
          fi
          gh issue create --label usage-guard \
            --title "Cloudflare 利用量が上限に達したためメンテ画面に切り替えました" \
            --body "今月のリクエスト合計: ${TOTAL:-不明（強制実行）} / しきい値: ${LIMIT:-9000000}

          本番 Worker kabu-radar をメンテ画面に差し替え、Cron も停止しました。

          ## 復旧手順
          翌月 1 日（UTC）以降に、Actions の「Deploy to Cloudflare Workers」を workflow_dispatch で実行してください。"
      - name: ジョブを失敗させて通知
        if: steps.check.outcome == 'failure' || steps.check.outputs.exceeded == 'true' || inputs.force_maintenance == true
        run: exit 1
